<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPT AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image_2301e1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chat-body">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="image_2301e1.png" alt="FPT Logo" class="fpt-logo">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-plus"></i> New conversation
            </button>
        </div>
        
        <div class="conversation-list" id="conversation-list">
            <h4>Saved conversations</h4>
            </div>
        
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Log out
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <h3 id="current-chat-title">FPT AI Assistant</h3>
        </div>
        
        <div class="chat-history" id="chat-history">
            <div class="welcome-message">
                <h2>Hello</h2>
                <p>I am a multi-system integrated AI support. How can I assist with what you are doing today?</p>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form id="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="message-input" placeholder="Enter your request for the AI ​​(e.g., Look up policies...)." required autocomplete="off">
                <button type="submit" id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
