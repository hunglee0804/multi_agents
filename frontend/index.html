<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPT AI Assistant - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image_2301e1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page-body">

    <div class="auth-container">
        <img src="image_2301e1.png" alt="FPT Logo" class="fpt-logo">
        
        <h2 id="auth-title">Log in</h2>
        
        <form id="auth-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="employee@fpt.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn" id="auth-btn">Log in</button>
        </form>

        <div id="auth-message"></div>

        <div class="toggle-auth">
            <p id="toggle-text">Don't have an account yet? <span onclick="toggleAuthMode()">Register now</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
